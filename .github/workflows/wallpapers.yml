name: Import photographic wallpapers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'os/fetch-wallpapers.py'
      - '.github/workflows/wallpapers.yml'
permissions:
  contents: write
concurrency:
  group: wallpaper-import
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 os/fetch-wallpapers.py
      - name: Commit reviewed assets only
        run: |
          git config user.name 'aera-wallpaper-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aera-shell/assets/wallpapers/*.jpg
          git diff --cached --quiet || { git commit -m "assets: bundle three CC0 photographic wallpapers"; git push origin HEAD:main; }
